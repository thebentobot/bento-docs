name: CI

on:
    pull_request:
    push:
        branches: [master]

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
            - run: npm run check:links
            - run: npm run format:check
