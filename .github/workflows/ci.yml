name: CI

on:
    pull_request:
    push:
        branches: [master]

jobs:
    validate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 26.12.1
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - run: npm run build
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - run: npm run check:links
            - run: npm run format:check
